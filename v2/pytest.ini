[pytest]
minversion = 7.0

testpaths = v2/tests

python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    smoke: Quick smoke tests
    regression: Full regression suite
    api: API tests
    ui: UI tests
    demo: Demo / training tests
    xdist_group(name): serialize tests sharing a common resource

addopts =
    -v
    --tb=short
    --strict-markers
    --alluredir=allure-results
    --clean-alluredir
    --ignore=v2/tests/ui
    --ignore=v2/tests/api

norecursedirs = 
    tests
    src
    .git
    .pytest_cache
    allure-report
    allure-results
    k6-run
    .venv
    .idea
    .ruff_cache